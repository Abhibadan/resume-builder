<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Student Resume Builder</title>
        <link rel="stylesheet" href="/resumes/editor.css" />
        <script type="module" src="/resumes/editor.js"></script>
    </head>
    <body>
        <header class="top">
            <div>
                <p class="eyebrow">Career toolkit</p>
                <h1>Student resume builder</h1>
            </div>
            <div class="actions">
                <label class="file"
                    >Import JSON <input id="import" type="file" accept=".json,application/json"
                /></label>
                <button id="download-json" type="button">Download JSON</button>
                <button id="download-pdf" class="primary" type="button" disabled>Download PDF</button>
                <button id="print" type="button" disabled>Open to print</button>
            </div>
        </header>
        <main class="workspace">
            <section aria-label="Resume editor" class="editor">
                <p class="intro">Enter your details and check the live A4 preview as you work.</p>
                <div id="fields"></div>
            </section>
            <section class="preview" aria-labelledby="preview-title">
                <div class="preview-heading">
                    <div>
                        <p class="eyebrow">A4 portrait</p>
                        <h2 id="preview-title">Live preview</h2>
                    </div>
                    <p id="fit" class="badge" role="status">Waiting for details</p>
                </div>
                <p id="status" role="status">Enter your name to start the preview.</p>
                <div id="report" hidden>
                    <ul id="warnings"></ul>
                    <details id="exclusions" hidden>
                        <summary id="exclusion-title">Excluded content</summary>
                        <ol id="excluded-items"></ol>
                    </details>
                </div>
                <div class="paper">
                    <p id="placeholder">Your resume will appear here.</p>
                    <iframe id="preview" title="A4 resume PDF preview" hidden></iframe>
                </div>
            </section>
        </main>
    </body>
</html>
